<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品卡片</title>
    <style>
        /* 做综合案例一定要先清除默认样式,再自己定义 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f1f1f1f1;
        }
        .project {
            /* 盒子属性 */
            width: 270px;
            height: 253px;
            background-color: #fff;
            margin: 50px auto;
            padding-top: 40px;
            /* 文字内容样式 */
            text-align: center;
            /* 圆角阴影 */
            border-radius: 10px;
        }
        .project img {
            width: 80px;
            border-radius: 50%;
        }
        .project h3 {
            margin-top: 20px;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: 400;
            color: #333;
        }
        .project p {
            font-size: 12px;
            color: #555;
        }


    </style>
</head>
<body>
    <div class="project">
        <img src="../Picture/天依与熊.png" alt="天依与熊">
        <h3>洛天依</h3>
        <p>知名虚拟主播,中V大手子</p>
    </div>
</body>
</html>
