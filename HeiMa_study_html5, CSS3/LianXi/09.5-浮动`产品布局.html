<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小练习-浮动-产品布局</title>
    <style>
        /*
        .box_blue {
            width: 100px;

        .box_orange {

        * {     /* 清除默认样式 */
            margin: 0;
            padding: 0;
        }
        li {    /* 清除li的样式 */
            list-style: none;
        }
        .product {  /* 总板块格式 */
            /* 版心居中 */
            margin: 50px auto;
            width: 1226px;
            height: 628px;
            background-color: pink;
        }
        .left {
            float: left;/* 浮动属性一般放前边 */
            width: 234px;
            height: 628px;
            background-color: skyblue;
        }
        .right {
            float: right;
            width: 978px;
            height: 628px;
            background-color: orange;
        }
        .right li {
            float: left;/* 一行的尺寸如果超过父级的尺寸的话会换行 */
            margin-right: 14px;
            margin-bottom: 14px;
            width: 234px;
            height: 300px;
            background-color: #6cf;
        }
        .right li:nth-child(4n) {   /* 取消掉第四个和第八个右边距 */
            margin-right: 0;
        }


    </style>
</head>
<body>
    <!-- 自己写的
    <div class="box_blue" style="float: left;"></div>
    <div style="float: left;">
        <div class="box_orange"></div>
        <div class="box_orange"></div>
    </div>
        <div style="float: left;">

    </div>

        <div class="box_orange"></div>
    </div>
        <div style="float: left;">
        <div class="box_orange"></div>
        <div class="box_orange"></div>
    </div> -->

    <!-- 版心为左右结构,右面8个产品放8个li -->
    <div class="product">
        <div class="left"></div>
        <div class="right">
            <ul>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </ul>
        </div>
    </div>

</body>
</html>
