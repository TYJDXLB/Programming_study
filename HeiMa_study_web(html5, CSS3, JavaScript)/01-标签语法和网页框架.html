<!-- HTML超文本标记语言 -->
<!-- 标签语法 :标签成对出现,中间包裹内容<英文标签名>结束标签加个/ -->
<strong>内容文本</strong>  <!-- 标签成对出现的是双标签 -->
<hr> <!-- 单标签 :没有结束标签,以/结尾(<br>换行;<hr>水平线) -->
<!-- 需要包裹内容的用双标签,不需要包裹内容的用单标签 -->

<!-- ####################################################################################################### -->

<!-- HTML基本骨架(网页模板) -->
<!DOCTYPE html>  <!-- 用作声明为HTML5文件-->
<html lang="en"> <!-- 根标签, 所有标签都要写在根标签内.后面的lang="en"代表网页主要语言为英语 -->
<head>  <!-- 头部标签, 存放给浏览器看的代码, 例如CSS -->
    <meta charset="UTF-8">  <!-- <meta>定义字符编,视口设置等 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title> <!-- 网页标题, 显示在浏览器标签上 -->
</head>
<body>  <!-- 主题标签, 存放给用户看的代码, 例如文本, 图片等 -->
    <strong>粗体:给用户看的内容,直接写在body标签内就行了</strong>
    <br>正常:给用户看的内容,直接写在body标签内就行了
</body>
</html>
