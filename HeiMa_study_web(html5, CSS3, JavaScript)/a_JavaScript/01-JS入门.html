    <script>  // D2
    // 1. 运算符  +=, -=, *=, /=, %= 和python的类似
    // 2. 自增，自减 (前置自增：++i；后置自增：i++；二者都类似于i += 1)
    let i = 1
    let k = 1
    console.log(++i + 2) // 4  前置自增，先自增再运算
    console.log(k++ + 2) // 3  后置自增，先运算再自增
    console.log(k) // 先用k+2得出结果3输出之后k再自增为2
    let test = 1
    // 【test++先使用所以为1，然后自增因此test++执行完之后test为2。之后test++先自增为3，执行完之后test为3。故最终为：1+3+3=7】
    console.log(test++ + ++test + test) // 7
    // 3. 比较运算符  >, >=, <, <=, ==, ===, !==(左右两边不相等)
    console.log(2 == '2') // true  比较运算符有隐式转换(== 表示数值是否相等)
    console.log(2 === '2') // false (=== 表示类型和值都相等)
    console.log(NaN === NaN) // false (NaN不等于任何人)
    console.log('a' < 'b') // true 字符串比较ASCII码
    // 4. 逻辑运算符 &&与，||或，！非
    // test6
    let num = +prompt('请输入数字：') // str转成数字
    alert(num % 4 === 0 && num % 100 !== 0)
    /* 运算符优先级：
        1. 小括号：()
        2. 一元运算符：++ -- !
        3. 算数运算符：先* / 后+ -
        4. 比较运算符：> >= < <=
        5. 相等运算符：== != === !==
        6. 逻辑运算符：先&& 后||
        7. 赋值运算符：=
        8. 逗号：, */








    </script>
