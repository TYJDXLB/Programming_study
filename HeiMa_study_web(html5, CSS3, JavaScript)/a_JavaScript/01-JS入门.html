    /* 
    基本数据类型和引用数据类型的存储放式
    简单类型（基本数据类型；值类型）：在存储变量时存储的是值本身
    复杂类型（引用类型）：在存储变量时存储的仅仅是地址（引用；内存）
    栈（操作系统）：由操作系统自动分配释放存放函数的参数值，局部变量的值等。简单数据放在其中
    堆（操作系统）：存储复杂类型(对象)，一般由程序员分配释放，如果程序员不释放，由垃圾回收机制回收。引用数据放在其中
    【简单类型数据存放在栈里面，假如定义let num = 10; 10存放在栈中，可以通过num找到栈里面的数据10；
    复杂数据类型数据存放在堆中，假如定义一个对象obj = {age = 18}，会先在栈中存放一个地址，把{age = 18}存放在堆中，可以通过obj找到栈中的地址，再通过地址找到堆中的数据】
    let num1 = 10
    let num2 = num1
    num2 = 20
    console.log(num1) // 10
    
    let obj1 = {
        age: 18
    }
    let obj2 = obj1 // 只是把obj1的地址给obj2了
    obj2.age = 20
    console.log(obj1.age) // 20  (obj1与obj2在堆内的内容是同一个，只是栈内开辟的空间不一样而已（地址一样）)
    */
