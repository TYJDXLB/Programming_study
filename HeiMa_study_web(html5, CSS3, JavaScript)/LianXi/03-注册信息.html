<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册页面</title>
</head>
<body>
    <h1>注册信息</h1>
    <hr>
    <form action="#" method="">
        <h2>个人信息</h2>
        <label>姓名:</label>&nbsp;<input type="text" placeholder="请输入姓名">
        <br><br>
        <label>密码:</label></label>&nbsp;<input type="password" placeholder="请输入密码">
        <br><br>
        <label>性别:</label>
            <label><input type="radio" name="gender" value="male"> 男</label>
            <label><input type="radio" name="gender" value="female"> 女</label>
        <br><br>
        <label>居住城市:</label>&nbsp;
        <select name="city" id="city">
            <option value="beijing">北京</option>
            <option value="shanghai">上海</option>
            <option value="guangzhou">广州</option>
            <option value="shenzhen">深圳</option>
            <option value="henan" selected>河南</option>
        </select>
        <br><br>
        <h2>教育经历</h2>
        <label>最高学历:</label>&nbsp;

            <option value="highschool">高中</option>
            <option value="bachelor" selected>本科</option>
            <option value="master">硕士</option>
            <option value="doctor">博士</option>
        </select>
        <br><br>
        <label>学校名称:</label>&nbsp;<input type="text" placeholder="请输入最高学历学校名称">
        <br><br>
        <label>所选专业:</label>&nbsp;<input type="text" placeholder="请输入所选专业">
        <br><br>
        <label>在校时间:</label>&nbsp;

            <option value="2014">2014</option>

            <option value="2016">2016</option>

            <option value="2019">2019</option>

        <label>---</label>
        <select name="schooltime" id="schooltime">
            <option value="2000">2000</option>
            <option value="2001">2001</option>
            <option value="2002">2002</option>
            <option value="2003">2003</option>

        <h2>工作经历</h2>
        <label>公司名称:</label>&nbsp;<input type="text" placeholder="请输入公司名称">
        <br><br>
        <label>工作描述:</label> <br>
        <textarea name="workdesc" id="workdesc" placeholder="请输入工作描述"></textarea>
        <br><br>
        <input type="checkbox" name="agree" value="agree"><label>已阅读并同意以下协议:</label>
        <ul>
            <li>&nbsp; <a href="#">《用户注册协议》</a></li>
            <li>&nbsp; <a href="#">《隐私政策》</a></li>
        </ul>
        <br><br>
        <button type="submit">免费注册</button>
