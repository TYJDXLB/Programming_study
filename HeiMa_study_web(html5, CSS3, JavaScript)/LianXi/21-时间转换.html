<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间转换</title>
</head>
<body>


    <script>
        function change (time_s) {
            // let min_temp = time_s % 3600
            // let time_h = (time_s - min_temp) / 3600 // 小时数
            // let s_temp = min_temp % 60
            // let time_min = (min_temp - s_temp) / 60 // 分钟数
            let time_h = parseInt(time_s / 3600) // 小时数
            let time_min = parseInt(time_s / 60 % 60) // 分钟数
            let s_temp = parseInt(time_s % 60) // 秒数
            let tempArr = [time_s, time_h, time_min, s_temp]
            // 数字转化为字符串类型，并补零(利用隐式转换：+两边只要有一个为字符串类型就两边都转化为字符串)
            for (let i = 0; i < tempArr.length; i++) {
                // if (tempArr[i] < 10) { // 如果小于10要补零
                //     tempArr[i] = '0' + tempArr[i]
                // }
                tempArr[i] = tempArr[i] < 10 ? '0' + tempArr[i] : tempArr[i] // 用三元运算符简便一点
            }
            return tempArr
        }
        let timeArr = change(+prompt('请输入秒数：'))
        document.write(`${timeArr[0]}秒转化为：${timeArr[1]}小时，${timeArr[2]}分钟，${timeArr[3]}秒`)
    </script>
</body>
</html>
