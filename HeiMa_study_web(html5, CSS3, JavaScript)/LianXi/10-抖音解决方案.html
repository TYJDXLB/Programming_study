<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音解决方案</title>
    <style>
        * {     /* 做案例一定要先清除默认格式 */
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        li {    /* 做案例一定要先清除默认格式 */
            list-style: none;
        }

        .box {
            margin: 50px auto;
            width: 1200px;
            height: 400px;
            /* background-color: #6cf; */
            padding: 50px;
            border: 1px solid #000;
            border-radius: 10px;
        }
        .box ul {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            align-content: space-evenly;
            height: 300px;
        }
        .box ul li {
            padding-left: 80px;
            width: 500px;
            height: 80px;
            /* background-color: pink; */
            background-repeat: no-repeat;
        }
        .box ul li h3 {
            color: #0f0f0f;
            font-size: 20px;
            line-height: 40px;
            font-weight: 350;
        }
        .box ul li p {
            color: #454545;
            font-size: 13px;
        }


    </style>
</head>
<body>
    <div class="box">
        <ul>
            <li style="background-image: url(../Picture/0-抖音解决方案.png);">
                <h3>一键发布多端</h3>
                <p>发布视频到抖音短视频,西瓜视频及今日头条</p>
            </li>
            <li style="background-image: url(../Picture/1-抖音解决方案.png);">
                <h3>管理视频内容</h3>
                <p>支持修改已发布稿件状态和实时查看视频审核状态</p>
            </li>
            <li style="background-image: url(../Picture/2-抖音解决方案.png);">
                <h3>发布携带组件</h3>
                <p>支持分享内容携带小程序,地理位置信息等组件,扩展内容及突出地域性</p>
            </li>
            <li style="background-image: url(../Picture/3-抖音解决方案.png);">
                <h3>数据评估分析</h3>
                <p>获取视频在对应产品内的数据表现,或去抖音热点,即使进行表现评估</p>
            </li>
        </ul>
    </div>
</body>
</html>
